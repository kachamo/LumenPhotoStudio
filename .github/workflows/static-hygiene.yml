name: Static hygiene

# Lightweight, Qt-free job that keeps the repo's cross-platform assumptions
# honest. The project is developed on Windows (case-insensitive NTFS); a
# wrong-case #include or .qrc <file> path compiles fine there and then
# silently breaks Linux/macOS. Catch that here, fast, without needing a
# full Qt toolchain.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: static-hygiene-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  case-and-includes:
    name: filesystem case-correctness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check case-correctness of includes and .qrc resources
        shell: bash
        run: bash .github/scripts/check-case-and-includes.sh
